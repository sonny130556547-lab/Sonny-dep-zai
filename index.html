<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Game Tài Xỉu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29, #0d0e15);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: #252836;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #3b3f54;
        }

        h1 {
            color: #f1c40f;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-board {
            background: #1e202d;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 1.2rem;
            color: #2ecc71;
            font-weight: bold;
        }

        /* Bàn Lắc */
        .dice-board {
            background: #1b4332;
            border: 8px solid #2d6a4f;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Quân Xúc Xắc */
        .dice {
            width: 50px;
            height: 50px;
            background-color: #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #d63031;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .shaking {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(15deg); }
            40% { transform: translate(1px, -1px) rotate(-15deg); }
            60% { transform: translate(-2px, 1px) rotate(10deg); }
            80% { transform: translate(2px, 1px) rotate(-10deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        /* Khu Vực Cược */
        .bet-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bet-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            opacity: 0.7;
        }

        .bet-btn.selected {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }

        .btn-xiu {
            background-color: #e74c3c;
        }

        .btn-tai {
            background-color: #2980b9;
        }

        .bet-amount-section {
            margin-bottom: 20px;
        }

        .bet-amount-section input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b3f54;
            background: #1e202d;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #f1c40f;
            color: #000;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #f39c12;
        }

        .action-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        /* Kết quả */
        .result-message {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }

        .win { color: #2ecc71; }
        .lose { color: #e74c3c; }

        /* Lịch sử */
        .history {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .dot-tai { background: #2980b9; color: #fff; }
        .dot-xiu { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>TÀI XỈU MÔ PHỎNG</h1>

    <div class="balance-board">
        Số dư: <span id="balance">1,000,000</span> VNĐ
    </div>

    <!-- Bàn Lắc -->
    <div class="dice-board" id="diceBoard">
        <div class="dice" id="dice1">?</div>
        <div class="dice" id="dice2">?</div>
        <div class="dice" id="dice3">?</div>
    </div>

    <!-- Cược -->
    <div class="bet-options">
        <button class="bet-btn btn-xiu" onclick="selectBet('XIU')">XỈU<br><small>(4 - 10)</small></button>
        <button class="bet-btn btn-tai" onclick="selectBet('TAI')">TÀI<br><small>(11 - 17)</small></button>
    </div>

    <div class="bet-amount-section">
        <input type="number" id="betAmount" placeholder="Nhập số tiền cược" value="100000" min="1000">
    </div>

    <button class="action-btn" id="playBtn" onclick="playGame()">LẮC XÚC XẮC</button>

    <div class="result-message" id="resultMsg"></div>

    <p style="margin-top: 15px; font-size: 0.9rem; color: #888;">Lịch sử kết quả:</p>
    <div class="history" id="history"></div>
</div>

<script>
    let balance = 1000000;
    let selectedChoice = null; // 'TAI' hoặc 'XIU'

    const dice1El = document.getElementById('dice1');
    const dice2El = document.getElementById('dice2');
    const dice3El = document.getElementById('dice3');
    const diceBoard = document.getElementById('diceBoard');
    const balanceEl = document.getElementById('balance');
    const resultMsgEl = document.getElementById('resultMsg');
    const playBtn = document.getElementById('playBtn');
    const historyEl = document.getElementById('history');

    function selectBet(choice) {
        selectedChoice = choice;
        document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('selected'));
        if (choice === 'XIU') {
            document.querySelector('.btn-xiu').classList.add('selected');
        } else {
            document.querySelector('.btn-tai').classList.add('selected');
        }
    }

    function formatMoney(amount) {
        return amount.toLocaleString('vi-VN');
    }

    function playGame() {
        const betAmount = parseInt(document.getElementById('betAmount').value);

        // Validation
        if (!selectedChoice) {
            alert('Vui lòng chọn TÀI hoặc XỈU!');
            return;
        }
        if (isNaN(betAmount) || betAmount <= 0) {
            alert('Số tiền cược không hợp lệ!');
            return;
        }
        if (betAmount > balance) {
            alert('Số dư không đủ!');
            return;
        }

        // Disable nút bấm khi đang lắc
        playBtn.disabled = true;
        resultMsgEl.innerText = "";
        resultMsgEl.className = "result-message";

        // Hiệu ứng lắc
        diceBoard.classList.add('shaking');

        setTimeout(() => {
            // TẠO KẾT QUẢ NGẪU NHIÊN (1-6)
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const d3 = Math.floor(Math.random() * 6) + 1;
            const total = d1 + d2 + d3;

            // Hiển thị mặt xúc xắc
            dice1El.innerText = d1;
            dice2El.innerText = d2;
            dice3El.innerText = d3;

            diceBoard.classList.remove('shaking');

            // Xác định kết quả Tài/Xỉu
            let gameResult = "";
            if (total >= 11 && total <= 17) {
                gameResult = "TAI";
            } else if (total >= 4 && total <= 10) {
                gameResult = "XIU";
            } else {
                // Trường hợp đặc biệt (Bộ ba đồng nhất 3-3-3 hoặc 1-1-1 tổng 3/18 - theo luật thường nhà cái ăn)
                gameResult = "BA_CON"; 
            }

            // Xử lý Thắng / Thua
            if (selectedChoice === gameResult) {
                balance += betAmount;
                resultMsgEl.innerText = `Kết quả: ${total} điểm - ${gameResult}. Bạn THẮNG +${formatMoney(betAmount)} VNĐ!`;
                resultMsgEl.classList.add('win');
            } else {
                balance -= betAmount;
                const resultText = (gameResult === "BA_CON") ? `Bộ 3 đồng nhất (${total} điểm)` : `${total} điểm - ${gameResult}`;
                resultMsgEl.innerText = `Kết quả: ${resultText}. Bạn THUA -${formatMoney(betAmount)} VNĐ!`;
                resultMsgEl.classList.add('lose');
            }

            // Cập nhật số dư
            balanceEl.innerText = formatMoney(balance);

            // Thêm vào lịch sử
            addHistory(gameResult, total);

            // Bật lại nút
            playBtn.disabled = false;
        }, 1200); // Lắc trong 1.2 giây
    }

    function addHistory(result, total) {
        if (result === "BA_CON") return;

        const dot = document.createElement('div');
        dot.className = `history-dot ${result === 'TAI' ? 'dot-tai' : 'dot-xiu'}`;
        dot.innerText = total;
        dot.title = `Tổng: ${total} (${result})`;

        // Giới hạn 10 kết quả gần nhất
        if (historyEl.children.length >= 10) {
            historyEl.removeChild(historyEl.firstChild);
        }
        historyEl.appendChild(dot);
    }
</script>

</body>
</html>
